<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk pengurus, Visco Vidatra</title>
  <meta name="description" content="Masuk ke kotak aspirasi Visco Vidatra untuk membaca dan menindaklanjuti surat siswa.">
  <meta name="theme-color" content="#0b0a09">
  <link rel="icon" href="/assets/portrait.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css?v=20261119b">
  <link rel="stylesheet" href="/css/auth.css?v=20261119b">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">Lewati ke konten</a>

  <header class="site-header site-header--minimal">
    <a class="brand" href="/" aria-label="Visco Vidatra, beranda">
      <img src="/assets/portrait.png" alt="" width="44" height="44">
      <span>Visco Vidatra</span>
    </a>
    <a class="text-link" href="/">Kembali ke beranda</a>
  </header>

  <main class="auth-main" id="main">
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="section-label">Akses pengurus</p>
      <h1 id="auth-title">Masuk ke kotak aspirasi.</h1>
      <p class="auth-lead">Gunakan akun pengurus untuk membaca dan menindaklanjuti surat siswa.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Nama pengguna</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="characters" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="password">Kata sandi</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button button-primary auth-submit" id="login-button" type="submit">Masuk</button>
        <p class="form-status" id="login-status" role="alert" aria-live="assertive"></p>
      </form>

      <p class="auth-note">Halaman ini hanya untuk pengurus. Siswa tidak perlu masuk untuk mengirim aspirasi.</p>
    </section>
  </main>

  <script type="module" src="/js/login.js?v=20261119b"></script>
</body>
</html>
